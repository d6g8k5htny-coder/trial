name: formal-gate

# Layer 1 formal-verification lane (Batch 828).
#
# Job 1 `formal-gate-static` — no Lean toolchain: schema, module hash lock,
#   status ladder vs binding receipts, blueprint alignment.  Fails closed.
# Job 2 `lean-kernel-check` — installs elan (Lean v4.19.0 pinned by
#   formal/lean/lean-toolchain), fetches the Mathlib cache, runs
#   `scripts/formal_gate.py --run-lake` on a FRESH runner, and uploads the
#   runner's receipt.  The committed receipt must agree with the runner's on
#   toolchain / mathlib_rev / module hashes / axioms / control outcomes.
# Job 3 `ai-prover-cross-check` — optional lane; runs only on
#   workflow_dispatch with a prover command supplied by the caller.  Records a
#   receipt; never changes status by itself.
#
# Scientific effect: NONE.  Green here is a kernel check of formal/lean/, not
# claim promotion, lemma closure, or prize status on d6g8k5htny-coder/main.
# No scheduled trigger (AGENTS.md: never enable scheduled workflows to satisfy
# R2-06 prose).

on:
  push:
    branches: ["main"]
    paths:
      - "formal/**"
      - "scripts/formal_gate.py"
      - "tests/test_formal_gate.py"
      - ".github/workflows/formal-gate.yml"
  pull_request:
    paths:
      - "formal/**"
      - "scripts/formal_gate.py"
      - "tests/test_formal_gate.py"
      - ".github/workflows/formal-gate.yml"
  workflow_dispatch:
    inputs:
      prover_command:
        description: >-
          Optional AI-prover cross-check command (e.g. a Goedel-Prover /
          DeepSeek-Prover wrapper). Must write a Lean file to
          formal/lean/crosscheck/Generated.lean. Empty = skip lane 3.
        required: false
        default: ""

permissions:
  contents: read

jobs:
  formal-gate-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Formal gate (static; fail-closed)
        run: |
          set -euo pipefail
          python scripts/formal_gate.py --report-out formal-gate-report.json
          grep -q '"lemma_closed": false' formal-gate-report.json
      - name: Formal gate unit tests
        run: python -m pytest -q tests/test_formal_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formal-gate-static-report
          path: formal-gate-report.json
          if-no-files-found: warn

  lean-kernel-check:
    runs-on: ubuntu-latest
    needs: formal-gate-static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install elan (toolchain from formal/lean/lean-toolchain)
        run: |
          set -euo pipefail
          TOOLCHAIN="$(tr -d '\r\n' < formal/lean/lean-toolchain)"
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain "$TOOLCHAIN"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib cache (~5.6 GB unpacked; too large for actions/cache, so fetched per run)
        working-directory: formal/lean
        run: |
          set -euo pipefail
          lake exe cache get
      - name: lake build + axiom audit + negative controls (fresh receipt)
        run: |
          set -euo pipefail
          python scripts/formal_gate.py --run-lake \
            --receipt-out /tmp/ci-receipt.json \
            --report-out /tmp/ci-gate-report.json
      - name: Committed receipt must agree with runner receipt
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, glob, sys
          ci = json.load(open('/tmp/ci-receipt.json'))
          keys = ('toolchain', 'mathlib_rev', 'module_sha256', 'axioms',
                  'lake_build_exit_code', 'axioms_exit_code')
          ok = False
          for path in glob.glob('formal/receipts/*.json'):
              rec = json.load(open(path))
              same = all(rec.get(k) == ci.get(k) for k in keys)
              ctrl_same = (
                  {c['path']: c['outcome'] for c in rec.get('negative_controls', [])}
                  == {c['path']: c['outcome'] for c in ci.get('negative_controls', [])}
              )
              print(f"{path}: fields_match={same} controls_match={ctrl_same}")
              ok = ok or (same and ctrl_same)
          if not ok:
              print('::error::no committed receipt reproduces the runner receipt', file=sys.stderr)
              sys.exit(1)
          print('committed receipt reproduced on fresh runner; lemma_closed=false; scientific_effect=NONE')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-kernel-check-receipt
          path: |
            /tmp/ci-receipt.json
            /tmp/ci-gate-report.json
          if-no-files-found: warn

  ai-prover-cross-check:
    # Optional lane 3.  Only meaningful when a caller provides a prover.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.prover_command != ''
    runs-on: ubuntu-latest
    needs: lean-kernel-check
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          set -euo pipefail
          TOOLCHAIN="$(tr -d '\r\n' < formal/lean/lean-toolchain)"
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain "$TOOLCHAIN"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib cache
        working-directory: formal/lean
        run: lake exe cache get
      - name: Run caller-supplied prover (writes formal/lean/crosscheck/Generated.lean)
        env:
          PROVER_COMMAND: ${{ github.event.inputs.prover_command }}
        run: |
          set -euo pipefail
          mkdir -p formal/lean/crosscheck
          bash -c "$PROVER_COMMAND"
          test -f formal/lean/crosscheck/Generated.lean
      - name: Kernel-check generated proof (independent lane; never changes status)
        working-directory: formal/lean
        run: |
          set -euo pipefail
          lake build
          lake env lean crosscheck/Generated.lean | tee /tmp/crosscheck.out
          if grep -q sorryAx /tmp/crosscheck.out; then
            echo "::error::generated proof depends on sorryAx"; exit 1
          fi
          echo "ai-prover cross-check KERNEL_ACCEPTED (record in formalization_status.json ai_prover_cross_check; not acceptance)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-prover-cross-check
          path: |
            formal/lean/crosscheck/Generated.lean
            /tmp/crosscheck.out
          if-no-files-found: warn
