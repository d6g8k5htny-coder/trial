name: PR98 final gate rereview
on:
  pull_request:
    paths:
      - 'reviews/pr98_final_gate_20260925/**'
      - '.github/workflows/pr98-final-gate-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: reviewer
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: d6g8k5htny-coder/main
          ref: cc6a578b26f14a16025f4c955fe5efdd65890b1f
          path: subject
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Bind exact subject and execute final boundary probes
        run: |
          set -euo pipefail
          test "$(git -C subject rev-parse HEAD)" = cc6a578b26f14a16025f4c955fe5efdd65890b1f
          echo '2213ca74a3b5fd74fcbbd915c324adc7660ca04a5f9a2e146499a64dff48b85e  subject/tools/claims_gate_adapter.py' | sha256sum -c -
          python -B -S reviewer/reviews/pr98_final_gate_20260925/probe.py --subject-root subject --output "$RUNNER_TEMP/final-gate-evidence"
      - name: Install exact upstream test dependencies
        working-directory: subject
        run: "python -m pip install --require-hashes --only-binary=:all: -r requirements-ci.lock"
      - name: Re-run focused gate suites from the subject
        working-directory: subject
        run: |
          set -o pipefail
          python -m pytest -q tests/test_claims_gate_adapter.py tests/test_claims_gate_enforcement.py tests/test_claims_gate_f2_coverage.py --junitxml="$RUNNER_TEMP/final-gate-evidence/focused-junit.xml" 2>&1 | tee "$RUNNER_TEMP/final-gate-evidence/focused.log"
      - name: Bind reviewer and subject bytes
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/final-gate-evidence/source"
          git -C reviewer rev-parse HEAD > "$RUNNER_TEMP/final-gate-evidence/reviewer-commit.txt"
          git -C subject rev-parse HEAD > "$RUNNER_TEMP/final-gate-evidence/subject-commit.txt"
          sha256sum subject/tools/claims_gate_adapter.py subject/claims/graph.json > "$RUNNER_TEMP/final-gate-evidence/subject-sha256.txt"
          cp reviewer/reviews/pr98_final_gate_20260925/probe.py "$RUNNER_TEMP/final-gate-evidence/source/"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr98-final-gate-evidence
          path: ${{ runner.temp }}/final-gate-evidence
          if-no-files-found: error
