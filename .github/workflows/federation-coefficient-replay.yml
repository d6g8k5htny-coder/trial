name: Source-pinned federation coefficient replay
'on':
  push:
    branches: [chatgpt/federation-coefficient-20260924]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify the exact public runner before executing
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -B -S - <<'PY'
          import hashlib, pathlib, subprocess, sys, urllib.request
          url='https://raw.githubusercontent.com/d6g8k5htny-coder/trial/54c80a7fe929347c64bb20b1c9b62c64b73954bd/federation/replay.py'
          with urllib.request.urlopen(url,timeout=45) as response:
              raw=response.read(6122)
          if len(raw)!=6121 or hashlib.sha256(raw).hexdigest()!='7f8329331ad453fabfba1bde03a73b6f3dd1f84fbfd7f6b36da2d951575f48cb':
              raise RuntimeError('runner identity mismatch')
          if sys.version_info[:2]!=(3,11):
              raise RuntimeError('actual Python 3.11 required')
          pathlib.Path('runner.py').write_bytes(raw)
          subprocess.run([sys.executable,'-B','-S','runner.py','--output',str(pathlib.Path('federation-evidence').resolve())],check=True,timeout=420)
          PY
      - name: Retain actual evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: federation-coefficient-${{ github.run_id }}
          path: |
            federation-evidence
            runner.py
          if-no-files-found: error
          retention-days: 30
