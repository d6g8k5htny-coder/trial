# Optional owner-triggered land of Option-B onto d6g8k5htny-coder/main.
#
# This does NOT run automatically. It requires:
#   1. Repo secret MAIN_PUSH_TOKEN — a PAT/fine-grained token with Contents:Write
#      (and PullRequests:Write) on d6g8k5htny-coder/main
#   2. Manual workflow_dispatch from the Actions tab (or gh workflow run)
#
# Scientific effect: NONE. Documentation-only redirect on default main.
# Prefer merging PR #2 when ready (Path A). This is Path B automation.
#
# dry_run semantics:
#   true  (default) — clone default main anonymously, git am the Option-B
#                     format-patch, print README head, exit 0 without push.
#                     Use this to verify the patch still applies.
#   false           — requires MAIN_PUSH_TOKEN; clone with the token, git am,
#                     push branch cursor/option-b-notice-from-trial, then open
#                     (or reuse) a draft PR into default main.
#                     Failure messages name the missing secret / HTTP denial.

name: land-option-b-on-main

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = apply locally only (no push). false = push branch + open PR (needs MAIN_PUSH_TOKEN)."
        type: boolean
        default: true

jobs:
  land:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout trial (portable Option-B patch)
        uses: actions/checkout@v4

      - name: Locate Option-B patch
        id: patch
        run: |
          set -euo pipefail
          PATCH="portable/main-default-branch/0001-option-b-default-branch-notice.patch"
          if [ ! -f "$PATCH" ]; then
            echo "::error::Missing Option-B patch at ${PATCH} (checked out ref=${GITHUB_REF}). Re-run from trial main/default branch that contains portable/main-default-branch/."
            exit 1
          fi
          echo "path=${PATCH}" >> "$GITHUB_OUTPUT"
          echo "Found patch: ${PATCH} ($(wc -c <"$PATCH") bytes)"

      - name: Require token unless dry-run
        if: ${{ inputs.dry_run == false }}
        env:
          MAIN_PUSH_TOKEN: ${{ secrets.MAIN_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${MAIN_PUSH_TOKEN}" ]; then
            echo "::error::dry_run=false but repository secret MAIN_PUSH_TOKEN is empty."
            echo "Add a PAT with Contents:Write (+ PullRequests:Write) on d6g8k5htny-coder/main, or re-run with dry_run=true."
            exit 1
          fi
          echo "MAIN_PUSH_TOKEN is set (value redacted)."

      - name: Clone default main, git am Option-B, push or dry-run
        id: land
        env:
          MAIN_PUSH_TOKEN: ${{ secrets.MAIN_PUSH_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          PATCH_PATH: ${{ steps.patch.outputs.path }}
        run: |
          set -euo pipefail
          PATCH="${GITHUB_WORKSPACE}/${PATCH_PATH}"
          if [ ! -f "$PATCH" ]; then
            echo "::error::Patch vanished after checkout: ${PATCH}"
            exit 1
          fi

          BRANCH="cursor/option-b-notice-from-trial"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

          rm -rf main-land
          if [ "${DRY_RUN}" = "true" ]; then
            echo "dry_run=true — cloning default main anonymously (no push)."
            if ! git clone --depth 1 https://github.com/d6g8k5htny-coder/main.git main-land; then
              echo "::error::git clone of d6g8k5htny-coder/main failed (transport)."
              exit 1
            fi
          else
            echo "dry_run=false — cloning with MAIN_PUSH_TOKEN."
            if ! git clone --depth 1 "https://x-access-token:${MAIN_PUSH_TOKEN}@github.com/d6g8k5htny-coder/main.git" main-land; then
              echo "::error::Authenticated clone failed. Token may lack Contents:Read/Write on d6g8k5htny-coder/main, or network failed."
              exit 1
            fi
          fi

          cd main-land
          git config user.name "trial-land-option-b"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${BRANCH}"

          # Same marker predicate as scripts/audit_main_alignment.py (local, no network).
          # Batch 241: prefer auditor ALIGNED short-circuit over Option-B notice
          # string match — renewed default tips (e.g. PR #72 Universal-law face)
          # carry SIDE24 + hardening + AGENTS without "q0 Research Program" prose,
          # so a narrow notice grep false-fails git am and breaks Path B readiness.
          AUDIT_LOCAL="${GITHUB_WORKSPACE}/scripts/audit_local_tree.py"
          if [ ! -f "$AUDIT_LOCAL" ]; then
            echo "::error::Missing ${AUDIT_LOCAL}. Option-B dry-run cannot verify auditor markers."
            exit 1
          fi
          echo "Running local auditor (pre-am; skip git am when already ALIGNED):"
          if python3 "$AUDIT_LOCAL" .; then
            echo "README/tree already ALIGNED (q0/notice markers, no complexity face); skipping git am (still push/PR if requested)."
          else
            if ! git am "$PATCH"; then
              echo "::error::git am failed for ${PATCH_PATH}. Default main tip may have moved; regenerate portable/main-default-branch/0001-*.patch against current main."
              git am --abort 2>/dev/null || true
              exit 1
            fi
            echo "Running local auditor against post-Option-B tree:"
            if ! python3 "$AUDIT_LOCAL" .; then
              echo "::error::Post-Option-B tree would NOT satisfy audit_main_alignment (need q0/notice markers, no complexity face). Fix portable/main-default-branch/ before landing Path B."
              exit 1
            fi
          fi
          echo "Applied Option-B (or reused existing ALIGNED tip). README head:"
          head -8 README.md
          echo "Local auditor: would-align=true (ALIGNED for remote audit_main_alignment)."

          if [ "${DRY_RUN}" = "true" ]; then
            echo "dry_run=true — apply + local auditor OK; not pushing. Re-run with dry_run=false + MAIN_PUSH_TOKEN to land."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Notice branch is disposable; force is OK if a previous attempt diverged.
          if ! git push -u origin "HEAD:refs/heads/${BRANCH}"; then
            if ! git push -u --force origin "HEAD:refs/heads/${BRANCH}"; then
              echo "::error::git push denied or failed. Confirm MAIN_PUSH_TOKEN has Contents:Write on d6g8k5htny-coder/main (expected HTTP 403 if scope missing)."
              exit 1
            fi
            echo "Pushed ${BRANCH} with --force (non-ff)."
          fi
          echo "Pushed branch ${BRANCH}."
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Open (or reuse) notice PR into default main
        if: ${{ inputs.dry_run == false && steps.land.outputs.pushed == 'true' }}
        env:
          MAIN_PUSH_TOKEN: ${{ secrets.MAIN_PUSH_TOKEN }}
          BRANCH: cursor/option-b-notice-from-trial
        run: |
          set -euo pipefail
          export GH_TOKEN="${MAIN_PUSH_TOKEN}"
          TITLE="docs: q0 redirect on default main (Option-B from trial)"
          BODY="$(cat <<'EOF'
          Option-B default-branch notice from trial automation.

          Scientific effect: **NONE**. Documentation-only redirect on default
          `main` (MISALIGNED after CoS PR #32). HOLD on PR #2 is **VOID**.
          Path B preferred for ALIGNED. Optional Path A:
          `PATH_A_MODE=revert32 ./scripts/owner_land_path_a.sh`
          EOF
          )"
          # Reuse existing open PR from this head if present
          EXISTING="$(gh pr list --repo d6g8k5htny-coder/main --head "${BRANCH}" --base main --state open --json number,url --jq '.[0].url // empty')"
          if [ -n "${EXISTING}" ]; then
            echo "Reusing open PR: ${EXISTING}"
            echo "Notice PR URL: ${EXISTING}"
            exit 0
          fi
          if ! URL="$(gh pr create --repo d6g8k5htny-coder/main --base main --head "${BRANCH}" \
              --title "${TITLE}" --body "${BODY}")"; then
            echo "::warning::gh pr create failed (token may lack PullRequests:Write). Branch is pushed: ${BRANCH}"
            echo "Open manually: https://github.com/d6g8k5htny-coder/main/compare/main...${BRANCH}"
            exit 0
          fi
          echo "Opened notice PR: ${URL}"
          echo "Next owner click: merge that PR (or Path A: merge main#2)."
