# One-shot: post Batch 322 wake comments on eng PRs in d6g8k5htny-coder/main.
# Cursor App ghs cannot Issues:write (comment 403); use durable MAIN_PUSH_TOKEN.
#
# Trigger (Contents write on trial — repository_dispatch):
#   printf '%s' '{"event_type":"wake-batch322-pr-comments"}' \
#     | gh api --method POST repos/d6g8k5htny-coder/trial/dispatches --input -
#
# Scientific effect: NONE. No claim/lemma promotion. Skip research drafts.

name: wake-batch322-pr-comments

on:
  repository_dispatch:
    types: [wake-batch322-pr-comments]
  workflow_dispatch:

jobs:
  comment:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout comment bodies
        uses: actions/checkout@v4

      - name: Post Batch 322 wake comments on eng PRs
        env:
          GH_TOKEN: ${{ secrets.MAIN_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "MAIN_PUSH_TOKEN secret missing — cannot comment on main eng PRs"
            exit 1
          fi
          python3 scripts/post_batch322_wake_comments.py
