name: trial-ci

on:
  push:
    branches: ["main", "cursor/**"]
  pull_request:

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Intent suite
        env:
          # Batch 74: Intent suite runs live probes (write vectors / watch / Path C).
          # Export runner token so tip reads do not degrade to TRANSPORT_ERROR when
          # `gh` has no interactive auth on the Actions runner.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m pytest -q
      - name: Alignment audit (read-only, expected MISALIGNED until main lands)
        env:
          # Batch 19b taught the audit script to send Authorization when present;
          # export the runner token so CI does not hit unauthenticated rate limits.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python scripts/audit_main_alignment.py
          code=$?
          set -e
          # 1 = misalignment still present on upstream main (current truth)
          # 0 = already fixed upstream
          # 2 = transport failure (fail the job)
          if [ "$code" -eq 2 ]; then exit 2; fi
          exit 0
      - name: Alignment watch (informational)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/watch_main_alignment.py | tee alignment-watch.json
          # Do not fail the job on MISALIGNED; that is the known upstream state.
      - name: ALIGNED drift watch (record-only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Batch 72: record tip SHA + markers + preferred restore route (B vs A).
          # Never fail the job on ALIGNED(0) or MISALIGNED(1) of remote main.
          # Transport(2) is also non-fatal here (record-only); audit step above
          # still fails the job on transport when the primary audit cannot run.
          set +e
          python scripts/aligned_drift_watch.py --no-probe | tee aligned-drift-watch.json
          code=$?
          set -e
          echo "aligned_drift_watch_exit=$code (record-only; not gating)"
          if [ -f portable/ALIGNED_DRIFT_SNAPSHOT.json ]; then
            echo "snapshot:"
            cat portable/ALIGNED_DRIFT_SNAPSHOT.json
          fi
          exit 0

  # Batch 86: no-status-promotion guard against live hardening tip.
  # Fetches main hardening shallow (needs network; uses GITHUB_TOKEN for rate limits).
  # continue-on-error: clone/API flakes must not red the whole trial CI; artifact retained.
  # Scientific effect: NONE. Never flips lemma_closed / research status.
  research-stack-status-guard:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          path: trial
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Shallow-clone main hardening tip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Prefer tokenized HTTPS so public-rate-limit ceilings do not flake the job.
          if [ -n "${GITHUB_TOKEN:-}" ]; then
            git clone --depth 1 --branch chatgpt/drive-github-hardening-20260919 \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/d6g8k5htny-coder/main.git" \
              main-hardening
          else
            git clone --depth 1 --branch chatgpt/drive-github-hardening-20260919 \
              https://github.com/d6g8k5htny-coder/main.git main-hardening
          fi
          echo "TIP=$(git -C main-hardening rev-parse HEAD)"
      - name: Run no-status-promotion guard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TIP="$(git -C main-hardening rev-parse HEAD)"
          # Baseline: last STATUS_GUARD_SNAPSHOT if present, else BATCH70 audit.
          # Force BATCH70 on first CI run so we do not compare against a stale
          # committed snapshot from a prior tip without explicit promotion check.
          python trial/scripts/guard_no_status_promotion.py main-hardening \
            --trial-root trial \
            --baseline trial/portable/BATCH70_RESEARCH_STACK_AUDIT.json \
            --snapshot-out trial/portable/STATUS_GUARD_SNAPSHOT.json \
            --tip-sha "$TIP" \
            --json-stdout | tee status-guard.json
          echo "guard_ok tip=$TIP"
      - name: Upload status-guard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: status-guard-snapshot
          path: |
            trial/portable/STATUS_GUARD_SNAPSHOT.json
            status-guard.json
          if-no-files-found: warn

  # Prove portable engineering patches still apply on the live working tip.
  # Scientific effect: NONE. Does not push to main.
  portable-patches-on-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: trial
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Shallow-clone main working tip
        run: |
          git clone --depth 1 --branch chatgpt/drive-github-hardening-20260919 \
            https://github.com/d6g8k5htny-coder/main.git main-work
          echo "TIP=$(git -C main-work rev-parse HEAD)"
      - name: Apply portable patches
        run: |
          cd main-work
          ../trial/portable/patches/apply_all.sh --check
          ../trial/portable/patches/apply_all.sh
      - name: Focused verification on patched tree
        run: |
          cd main-work
          python tools/math_status_check.py
          python -m pytest -q \
            tests/test_carriers.py \
            tests/test_math_status.py \
            tests/test_inventable_jetmod_probes.py \
            tests/test_gaussian_moments.py \
            tests/test_inventable_jetmod_instrumentation_status.py
      - name: Option-B apply check against default main
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main \
            https://github.com/d6g8k5htny-coder/main.git main-default
          # Batch 74: default tip is ALIGNED post-#41 (AGENTS.md + SIDE24 notice).
          # Classic Option-B format-patch is idempotent / already applied — skip
          # --check when the tip already carries the ALIGNED face; still prove
          # would-apply when MISALIGNED (pre-notice tip).
          if [[ -f main-default/AGENTS.md ]] && grep -q SIDE24 main-default/README.md; then
            echo "Option-B apply check SKIPPED — default main already ALIGNED (idempotent)"
            exit 0
          fi
          git -C main-default apply --check \
            "$GITHUB_WORKSPACE/trial/portable/main-default-branch/0001-option-b-default-branch-notice.patch"
          echo "Option-B format-patch still applies on default main"

  # Batch 73: validate land-option-b + land-path-c workflows WITHOUT MAIN_PUSH_TOKEN.
  # Covers YAML/dry_run contract, owner --help, and anonymous Path B/C --dry-run.
  # Scientific effect: NONE. Never flips lemma_closed / research status.
  land-workflows-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML (workflow parse)
        run: python -m pip install pyyaml
      - name: Validate land workflow dry_run contract (no MAIN_PUSH_TOKEN)
        run: |
          python scripts/validate_land_workflows.py --json | tee land-workflows-validate.json
          python scripts/validate_land_workflows.py
      - name: Owner land scripts --help (no token)
        run: |
          chmod +x scripts/owner_land_path_b.sh scripts/owner_land_path_c.sh
          ./scripts/owner_land_path_b.sh --help
          ./scripts/owner_land_path_c.sh --help
      - name: actionlint land workflows (syntax; no secrets)
        run: |
          set -euo pipefail
          # Pin a known actionlint release; fail closed if download broken.
          curl -sSfL -o actionlint.tgz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          tar -xzf actionlint.tgz actionlint
          ./actionlint -color \
            .github/workflows/land-option-b-on-main.yml \
            .github/workflows/land-path-c-on-main.yml
      - name: Path B/C owner --dry-run (anonymous clone; no MAIN_PUSH_TOKEN)
        env:
          # Unset any accidental token so dry-run cannot rely on push auth.
          MAIN_PUSH_TOKEN: ""
          GH_TOKEN: ""
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # GITHUB_TOKEN is fine for read-only API rate limits in dry-run helpers;
          # MAIN_PUSH_TOKEN stays empty — dry-run must not need it.
          unset MAIN_PUSH_TOKEN || true
          ./scripts/owner_land_path_b.sh --dry-run | tee path-b-dry-run.out
          ./scripts/owner_land_path_c.sh --dry-run | tee path-c-dry-run.out
          grep -E 'ALREADY_ALIGNED|would-align|APPLY_READY' path-b-dry-run.out path-c-dry-run.out
